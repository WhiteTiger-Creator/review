type: object
required: [arm_id, replay_digest, bank_fingerprint, rows, obligation_violations]
properties:
  arm_id:
    type: string
  replay_digest:
    type: string
    pattern: "^[0-9a-f]{8}$"
  bank_fingerprint:
    type: string
    pattern: "^[0-9a-f]{8}$"
  obligation_violations:
    type: integer
  rows:
    type: array
    items:
      type: object
      required: [row_seq, instance_key, duty_cycles, corpus_tag, lane_phase]
      properties:
        row_seq: {type: integer}
        instance_key: {type: string}
        duty_cycles: {type: integer}
        corpus_tag: {type: string}
        lane_phase: {type: integer}
