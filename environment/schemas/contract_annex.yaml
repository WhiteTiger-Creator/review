# Normative numeric annex for graded bundle emission (arm 0763).
# Authoritative over corpus/playbooks and docs/r5_link_notes.md.
replay_digest:
  width_hex: 8
  lowercase: true
  material_fields: [row_seq, instance_key, duty_cycles, corpus_tag, lane_phase]
  joiner: "|"
  row_suffix: ";"
  bank_suffix: "#bf|{bank_fingerprint}"
  hash: sha256
  truncate_hex: 8
bank:
  cache_key_fields: [instance_key, corpus_tag, bank_epoch]
  od_margin: "((ikey_nibble + od_bias) * bank_epoch + (corpus_tag==a ? 1 : 0)) & 0xff"
  duty_after_margin: "base_duty + od_margin"
  fingerprint_material: "{bank_epoch}|{od_bias}|{profile_word:x}"
  fingerprint_hash: sha256
  fingerprint_truncate_hex: 8
  stress_must_miss_warm_hits: true
kidx:
  magic: A763
  reloc_formula: "tmp = (tag - reloc_base) * reloc_stride + reloc_bias; remapped = tmp ^ reloc_xor"
  instance_key_format: "i{remapped:04x}"
  duty_from_payload: "max(1, (sum(payload) + max(0, len(payload) - 1)) // max(1, len(payload)))"
cross_terms:
  masked_cross: "cross_weight ^ (profile_word & profile_mask) ^ holdout_salt"
  corpus_a_duty: "duty_a * duty_b + masked_cross"
  stress_order: "apply cross_terms first, then multiply corpus_a by stress_multiplier when lane_phase >= 2"
  stress_floor: "(masked_cross + duty_b) * stress_multiplier"
obligation_nine:
  scale: "stress_multiplier when lane_phase >= 2 else 1"
  raw_a: "duty_a // scale"
  derived_raw_a: "max(0, raw_a - masked_cross) // max(1, duty_b)"
  expected_duty_a: "(derived_raw_a * duty_b + masked_cross) * scale"
  violation_when: "duty_a % scale != 0 or abs(duty_a - expected) > tolerance"
journal:
  warm_duty_checksum: "pre-cross calibration rows after warm-epoch stain margins"
  stress_duty_checksum: "post-fold final bundle rows"
  duty_checksum_fields: [instance_key, corpus_tag, duty_cycles]
  duty_joiner: ":"
  row_suffix: ";"
