# Shared HTTP maps used by both origin listeners.

sendfile on;
keepalive_timeout 15;
server_tokens off;
etag on;

map $uri $artifact_class {
    default "";
    ~^/artifacts/stable/ "stable";
    ~^/artifacts/candidate/ "candidate";
    ~^/metadata/ "metadata";
    ~^/large/ "large";
    ~^/policy/vary-encoding\.bin$ "metadata";
}
