worker_processes 1;
error_log /srv/mirrorveil/runtime/primary/logs/error.log warn;
pid /srv/mirrorveil/runtime/primary/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /srv/mirrorveil/nginx/mime-artifacts.conf;
    include /srv/mirrorveil/nginx/common-http.conf;
    access_log /srv/mirrorveil/runtime/primary/logs/access.log combined;

    server {
        listen 127.0.0.1:18191;
        server_name releases.aurora.invalid;

        location = /__mirror_health {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ready\n";
        }

        location ^~ /policy/set-cookie.bin {
            alias /srv/mirrorveil/origins/primary/releases.aurora.invalid/policy/set-cookie.bin;
            add_header Set-Cookie "session=edge-demo; Path=/" always;
            add_header Cache-Control "public, max-age=1" always;
            add_header X-Origin-Node "primary" always;
        }

        location ^~ /policy/private.bin {
            alias /srv/mirrorveil/origins/primary/releases.aurora.invalid/policy/private.bin;
            add_header Cache-Control "private, max-age=1" always;
            add_header X-Origin-Node "primary" always;
        }

        location ^~ /policy/no-store.bin {
            alias /srv/mirrorveil/origins/primary/releases.aurora.invalid/policy/no-store.bin;
            add_header Cache-Control "no-store" always;
            add_header X-Origin-Node "primary" always;
        }

        location ^~ /policy/vary-star.bin {
            alias /srv/mirrorveil/origins/primary/releases.aurora.invalid/policy/vary-star.bin;
            add_header Cache-Control "public, max-age=1" always;
            add_header Vary "*" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class "metadata" always;
        }

        location ^~ /policy/vary-language.bin {
            alias /srv/mirrorveil/origins/primary/releases.aurora.invalid/policy/vary-language.bin;
            add_header Cache-Control "public, max-age=1" always;
            add_header Vary "Accept-Language" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class "metadata" always;
        }

        location ^~ /policy/vary-encoding.bin {
            alias /srv/mirrorveil/origins/primary/releases.aurora.invalid/policy/vary-encoding.bin;
            add_header Cache-Control "public, max-age=1" always;
            add_header Vary "Accept-Encoding" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class "metadata" always;
        }

        location / {
            root /srv/mirrorveil/origins/primary/releases.aurora.invalid;
            add_header Cache-Control "public, max-age=1" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class $artifact_class always;
        }
    }

    server {
        listen 127.0.0.1:18191;
        server_name releases.basalt.invalid;

        location = /__mirror_health {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ready\n";
        }

        location ^~ /policy/set-cookie.bin {
            alias /srv/mirrorveil/origins/primary/releases.basalt.invalid/policy/set-cookie.bin;
            add_header Set-Cookie "session=edge-demo; Path=/" always;
            add_header Cache-Control "public, max-age=1" always;
            add_header X-Origin-Node "primary" always;
        }

        location ^~ /policy/private.bin {
            alias /srv/mirrorveil/origins/primary/releases.basalt.invalid/policy/private.bin;
            add_header Cache-Control "private, max-age=1" always;
            add_header X-Origin-Node "primary" always;
        }

        location ^~ /policy/no-store.bin {
            alias /srv/mirrorveil/origins/primary/releases.basalt.invalid/policy/no-store.bin;
            add_header Cache-Control "no-store" always;
            add_header X-Origin-Node "primary" always;
        }

        location ^~ /policy/vary-star.bin {
            alias /srv/mirrorveil/origins/primary/releases.basalt.invalid/policy/vary-star.bin;
            add_header Cache-Control "public, max-age=1" always;
            add_header Vary "*" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class "metadata" always;
        }

        location ^~ /policy/vary-language.bin {
            alias /srv/mirrorveil/origins/primary/releases.basalt.invalid/policy/vary-language.bin;
            add_header Cache-Control "public, max-age=1" always;
            add_header Vary "Accept-Language" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class "metadata" always;
        }

        location ^~ /policy/vary-encoding.bin {
            alias /srv/mirrorveil/origins/primary/releases.basalt.invalid/policy/vary-encoding.bin;
            add_header Cache-Control "public, max-age=1" always;
            add_header Vary "Accept-Encoding" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class "metadata" always;
        }

        location / {
            root /srv/mirrorveil/origins/primary/releases.basalt.invalid;
            add_header Cache-Control "public, max-age=1" always;
            add_header X-Origin-Node "primary" always;
            add_header X-Artifact-Class $artifact_class always;
        }
    }

    server {
        listen 127.0.0.1:18191 default_server;
        server_name health.mirrorveil.invalid _;

        location = /__mirror_health {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ready\n";
        }

        location / {
            return 404;
        }
    }
}
