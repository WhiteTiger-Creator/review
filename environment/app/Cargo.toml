[package]
name = "signingd"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "signingd"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
cryptoki = "0.9"
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = false
codegen-units = 16
