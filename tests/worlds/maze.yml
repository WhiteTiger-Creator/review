# Verifier-owned world used for the randomized model-based walk.
services:
  hub:
    labels:
      dungeon.entry: "true"
      dungeon.items: "torch, key.green"
    depends_on:
      - north
      - east
      - south

  north:
    labels:
      dungeon.items: "key.white"

  east:
    labels:
      dungeon.lock: "green"
      dungeon.items: "gem.emerald"
    depends_on:
      - attic

  south:
    labels:
      dungeon.dark: "true"
      dungeon.items: "gem.moss, key.black"

  attic:
    labels:
      dungeon.lock: "white"
      dungeon.goal: "true"
      dungeon.items: "lens"
    depends_on:
      - north

  blackroom:
    labels:
      dungeon.lock: "black"
      dungeon.dark: "true"
      dungeon.items: "gem.void"
    depends_on:
      - south

  isolated:
    labels:
      dungeon.items: "gem.lost"
