# Verifier-owned world exercising the alternate compose syntaxes:
# list-form labels, long-form depends_on, and messy item whitespace.
# The only torch sits inside a dark room, so key.blue can never be
# collected and bluevault must stay unreachable.
services:
  lobby:
    labels:
      - "dungeon.entry=true"
      - "dungeon.items=key.red ,  coin"
    depends_on:
      archive:
        condition: service_started
      basement:
        condition: service_started

  archive:
    labels:
      - "dungeon.lock=red"
      - "dungeon.items=map"

  basement:
    labels:
      - "dungeon.dark=true"
      - "dungeon.items=torch, key.blue"

  bluevault:
    labels:
      - "dungeon.lock=blue"
      - "dungeon.goal=true"
      - "dungeon.items=gem.sapphire"
    depends_on:
      - archive
