version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "data-processing"
subcategories = ["long_context", "api_integration", "tool_specific"]
number_of_milestones = 0
codebase_size = "small"
languages = ["java", "bash"]
tags = [
  "mlflow",
  "graph-canonicalization",
  "digest-pipeline",
  "callback-intake",
  "schema-validation",
  "git-history",
]
expert_time_estimate_min = 300
junior_time_estimate_min = 720

[agent]
# Platform edition_2 cap is 1800s.
timeout_sec = 1800

[verifier]
# Offline Gradle rebuild + full API workflow needs headroom on slower hosts.
timeout_sec = 1800

[environment]
# Cold Gradle multi-stage builds exceed 1200s without cache (EnvironmentStartTimeoutError).
build_timeout_sec = 2400
cpus = 2
memory_mb = 6144
storage_mb = 15360
allow_internet = false
