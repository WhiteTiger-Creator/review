# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "system-administration"
# Options for subcategories are: "long_context", "tool_specific",
# "api_integration", "db_interaction", "ui_building"
subcategories = []
# The number of milestones in the task (can be zero if not a milestone task)
number_of_milestones = 0
# Size of the codebase: minimal -> 0-20 files, small -> 20+ files, large -> 200+
codebase_size = "minimal"
# Coding languages used in the oracle solution or required by the agent
languages = ["rust"]
# Free-form keywords for tools/libraries/techniques
tags = ["log-management", "log-rotation", "retention-policy", "capacity-management", "config-inference"]
# Estimated time to complete (minutes)
expert_time_estimate_min = 120
junior_time_estimate_min = 480

# Verifier: runs the test script to check task completion
[verifier]
timeout_sec = 300.0

# Agent: limits how long the agent can run when attempting the task
[agent]
timeout_sec = 1800.0
# No Dockerfile USER directive is set, so the container defaults to root,
# which the verifier needs to create and write the harness log directory
# (/logs/verifier/reward.txt) at runtime. The agent's inability to read,
# copy, or trace the sealed daemon comes from the Dockerfile-created
# unprivileged "agent" / privileged "oracle" users and the set-uid/
# execute-only permissions on the daemon binary, not from a task.toml
# field -- [verifier].user / [agent].user is not part of the documented
# task.toml schema.

# Sandbox environment limits
[environment]
build_timeout_sec = 900.0
docker_flags = []
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
gpu_types = []
allow_internet = false
