category_specific_verifier_risks = "settings-only patch, skipping finalize, stale replay copy, fixture overwrite"
coverage_role = "Adds Go registry-bound quantized evaluation with staged promotion and ledger replay"

[reference_pattern]
justification_if_none = "docs/reference_tasks/index.json has an empty references list; no promoted ml_model_lifecycle Go reference exists"

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 900

[environment]
allow_internet = false
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
