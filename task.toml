version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "machine-learning"
subcategories = []
tags = ["machine-learning", "model-registry", "promotion", "evaluation-ledger", "quantized-inference", "metamorphic-testing"]
languages = ["go"]
codebase_size = "large"
number_of_milestones = 0
expert_time_estimate_min = 180
junior_time_estimate_min = 480

[category_profile]
challenge_family = "model promotion and evaluation lineage"
profile_name = "ml_model_lifecycle"
allowed_instruction_disclosures = "registry authority, promotion workflow, ledger replay rules, metamorphic evaluation contracts, CLI"
forbidden_instruction_leaks = "fix-path symbols, staged-incomplete evaluate shortcut, held-out seeds"
