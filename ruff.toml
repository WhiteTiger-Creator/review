# Vendored Rust crates are not task Python. Platform CI runs
# `ruff check` on the task root and must not lint Cargo vendor trees.
line-length = 100
extend-exclude = [
    "environment/app/vendor",
]

[lint]
extend-select = ["RUF", "PIE", "SIM", "PERF", "PLC", "PLW"]

[lint.per-file-ignores]
# sys.path is adjusted before importing the local reference package.
"tests/test_outputs.py" = ["E402"]
